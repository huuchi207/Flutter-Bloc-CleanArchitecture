name: app
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'

dependency_overrides:
  analyzer: 8.1.1
  js: ^0.7.0
  dart_style: 3.1.2
dependencies:
  async: 2.13.0
  auto_route: 10.1.2
  cached_network_image: 3.2.1
  cupertino_icons: 1.0.3
  dartx: 1.1.0
  domain:
    path: ../domain
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: 8.0.1
  flutter_local_notifications: 19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: 5.9.3
  flutter_svg: 2.2.3
  get_it: 9.2.0
  infinite_scroll_pagination: 4.0.0
  initializer:
    path: ../initializer
  injectable: 2.7.1+4
  resources:
    path: ../resources
  rxdart: 0.28.0
  shared:
    path: ../shared
  tuple: 2.0.2
  freezed_annotation: 3.1.0

dev_dependencies:
  auto_route_generator: 10.2.5
  bloc_test: 9.1.3
  build_runner: 2.10.5
  custom_lint: 0.8.1
  flutter_gen_runner: 5.12.0
  flutter_launcher_icons: 0.14.4
  flutter_lints: 2.0.1
  flutter_native_splash: 2.4.7
  flutter_test:
    sdk: flutter
  freezed: 3.2.4
  injectable_generator: 2.12.0
  logging: 1.3.0
  mocktail: 0.3.0
  nals_lints:
    path: ../nals_lints

# Config generate when build
flutter_gen:
  output: lib/resource/generated
  line_length: 160

  integrations:
    flutter_svg: true
    # flare_flutter: true

  assets:
    enabled: true

  fonts:
    enabled: true
  # colors:
  #   enabled: true
  #   inputs:
  #     - assets/color/colors.xml
flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/images/
